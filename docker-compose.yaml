services:
  app:
    depends_on:
      db:
        condition: service_healthy
        restart: true
    build: .
    ports:
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    env_file: .env
    command: /app/main

  csv_import:
    depends_on:
      db:
        condition: service_healthy
        restart: true
    build: .
    env_file: .env
    command: /app/data_importer
    profiles:
      - dontstart

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DBNAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DBNAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  postgres_data:
